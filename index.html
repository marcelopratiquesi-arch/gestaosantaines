        const Icons = {

            Check: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>,
            Star: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>,
            Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,

            Eye: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            Close: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>,
            Settings: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            Swap: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>,
            Sparkles: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
            Robot: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
            Send: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>,
            Alert: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
            ArrowLeft: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        };

        const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        const formatNumber = (val) => new Intl.NumberFormat('pt-BR').format(val || 0);

        const parseMoney = (val) => {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            if (typeof val === 'string') {
                return parseFloat(val.replace(/[^\d,-]/g, '').replace(',', '.')) || 0;
            }
            return 0;
        };

        const getUnit = (planName, overrides = {}) => {
            if (!planName || typeof planName !== 'string') return 'SI1';
            if (overrides[planName]) return overrides[planName];

            const upper = String(planName).trim().replace(/\s+/g, ' ').toUpperCase();

            if (upper.includes("COMBO 15 DIAS - PLANO FERIAS") || upper.includes("COMBO 7 DIAS - PLANO FERIAS")) return 'IGNORE';
            if (upper.startsWith('SANTA INES 2 | CLASS') || upper.startsWith('SANTA INÊS 2 | CLASS')) return 'SI2';

            const keywordsSI2 = ["S2", "S02", "SI2", "SI 2", "SI02", "SI 02", "S I -2", "S I - 2", "S I TRACINHO 2", "S12", "SI-2", "SI - 2"];
            if (keywordsSI2.some(k => upper.includes(k))) return 'SI2';

            return 'SI1';
        };

        const classificarGrupoEntrada = (planName, overrides = {}) => {
            if (overrides[planName]) return overrides[planName];
            const upper = String(planName || '').trim().replace(/\s+/g, ' ').toUpperCase();

            if (upper.includes('NUTRI')) return 'NUTRI';
            if (upper.startsWith('SANTA INES 2 | CLASS') || upper.startsWith('SANTA INÊS 2 | CLASS')) return 'CLASS';
            if (upper.includes('PLUS')) return 'PLUS';
            if (upper.includes('FIT')) return 'FIT';

            return 'OUTROS';
        };

        const isNutriPlan = (planName) => {
            if (!planName || typeof planName !== 'string') return false;
            return planName.toUpperCase().includes("NUTRI") || planName.toUpperCase().includes("COMBO");
        };

        const isPlusPlan = (planName, isAlreadyNutri) => {
            if (isAlreadyNutri) return false; 
            if (!planName || typeof planName !== 'string') return false;
            return planName.toUpperCase().includes("PLUS");
        };

        const findSmartColumns = (headerRow, firstDataRow) => {
            let planIdx = -1; let valIdx = -1;
            if (headerRow) {
                const headers = headerRow.map(h => String(h).toUpperCase());
                headers.forEach((h, i) => {
                    if (h.includes('VALOR') || h.includes('TOTAL') || h.includes('PAGO') || h.includes('RECEBER')) valIdx = i;
                    if (h.includes('PLANO') || h.includes('PRODUTO') || h.includes('DESCRIÇÃO')) planIdx = i;
                });
            }
            if ((planIdx === -1 || valIdx === -1) && firstDataRow) {
                firstDataRow.forEach((cell, i) => {
                    const txt = String(cell);
                    if (valIdx === -1 && (txt.includes('R$') || typeof cell === 'number')) valIdx = i; 
                    if (planIdx === -1 && (txt.toUpperCase().includes('SI') || txt.toUpperCase().includes('PRATIQUE'))) planIdx = i;
                });
            }
            if (planIdx === -1) planIdx = 12; 
            if (valIdx === -1) valIdx = 19;   
            return { planIdx, valIdx };
        };

        const findHeader = (data, keywords) => {
            for (let i = 0; i < Math.min(data.length, 30); i++) {
                const rowStr = (data[i] || []).join(' ').toUpperCase();
                if (keywords.some(k => rowStr.includes(k))) return i;
            }
            return 0;
        };

        // --- Config Modal (Acessível independente da etapa) ---
        const ConfigModal = ({ isOpen, onClose, allPlans, entradasPlans, unitOverrides, groupOverrides, onToggleUnitOverride, onToggleGroupOverride }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [activeTab, setActiveTab] = useState('unidades');
            const [feedback, setFeedback] = useState(false);
            
            if (!isOpen) return null;

            const handleUnitOverride = (plan, targetUnit) => {
                onToggleUnitOverride(plan, targetUnit);
                showFeedback();
            };

            const handleGroupOverride = (plan, targetGroup) => {
                onToggleGroupOverride(plan, targetGroup);
                showFeedback();
            };

            const showFeedback = () => {
                setFeedback(true);
                setTimeout(() => setFeedback(false), 2000);
            };

            const si1Plans = []; const si2Plans = []; const ignoredPlans = [];
            allPlans.forEach(plan => {
                if (!plan.toLowerCase().includes(searchTerm.toLowerCase())) return;
                const unit = getUnit(plan, unitOverrides);
                if (unit === 'IGNORE') ignoredPlans.push(plan);
                else if (unit === 'SI1') si1Plans.push(plan);
                else si2Plans.push(plan);
            });
            si1Plans.sort(); si2Plans.sort(); ignoredPlans.sort();

            const groupsSI1 = { NUTRI: [], PLUS: [], FIT: [], CLASS: [], OUTROS: [] };
            const groupsSI2 = { NUTRI: [], PLUS: [], FIT: [], CLASS: [], OUTROS: [] };

            entradasPlans.forEach(plan => {
                if (!plan.toLowerCase().includes(searchTerm.toLowerCase())) return;
                const unit = getUnit(plan, unitOverrides);
                if (unit === 'IGNORE') return; 

                const grupo = classificarGrupoEntrada(plan, groupOverrides);
                if (unit === 'SI1') {
                    if (groupsSI1[grupo]) groupsSI1[grupo].push(plan);
                } else if (unit === 'SI2') {
                    if (groupsSI2[grupo]) groupsSI2[grupo].push(plan);
                }
            });
            
            Object.keys(groupsSI1).forEach(k => groupsSI1[k].sort());
            Object.keys(groupsSI2).forEach(k => groupsSI2[k].sort());

            const PlanUnitCard = ({ plan, currentUnit }) => (
                <div className="bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex flex-col gap-2 transition-all hover:shadow-md">
                    <span className="text-xs font-semibold text-gray-800 truncate" title={plan}>{plan}</span>
                    <select value={currentUnit} onChange={(e) => handleUnitOverride(plan, e.target.value)} className="text-xs bg-gray-50 border border-gray-300 text-gray-700 rounded p-1.5 focus:ring-1 focus:ring-gray-400 outline-none w-full">
                        <option value="SI1">Santa Inês 1</option>
                        <option value="SI2">Santa Inês 2</option>
                        <option value="IGNORE">Não Classificado</option>
                    </select>
                </div>
            );

            const PlanGroupCard = ({ plan, currentGroup }) => (
                <div className="bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex flex-col gap-2 transition-all hover:shadow-md">
                    <span className="text-xs font-semibold text-gray-800 truncate" title={plan}>{plan}</span>
                    <select value={currentGroup} onChange={(e) => handleGroupOverride(plan, e.target.value)} className="text-xs bg-gray-50 border border-gray-300 text-gray-700 rounded p-1.5 focus:ring-1 focus:ring-gray-400 outline-none w-full">
                        <option value="NUTRI">🥗 NUTRI</option>
                        <option value="PLUS">⭐ PLUS</option>
                        <option value="FIT">🏃 FIT</option>
                        <option value="CLASS">🏋️ CLASS</option>
                        <option value="OUTROS">🧩 OUTROS PLANOS</option>
                    </select>
                </div>
            );

            const renderGroupColumn = (title, plans, borderColor, bgColor, textColor) => (
                <div className={`flex flex-col bg-white rounded-xl shadow-sm border-t-4 ${borderColor} overflow-hidden border border-gray-100`}>
                    <div className={`p-2 ${bgColor} ${textColor} font-bold text-center border-b border-gray-100 uppercase text-xs flex justify-between px-3 items-center`}>
                        <span>{title}</span>
                        <span className="bg-white/50 px-2 rounded-full text-[10px]">{plans.length}</span>
                    </div>
                    <div className="flex-1 overflow-y-auto p-2 space-y-2 max-h-[350px]">
                        {plans.length > 0 
                            ? plans.map(p => <PlanGroupCard key={p} plan={p} currentGroup={classificarGrupoEntrada(p, groupOverrides)} />)
                            : <div className="text-[10px] text-gray-400 text-center py-4 italic">Nenhum plano.</div>
                        }
                    </div>
                </div>
            );

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-70 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-[1400px] max-h-[90vh] flex flex-col animate-up">
                        <div className="p-4 border-b flex flex-col md:flex-row justify-between items-center rounded-t-xl bg-gray-900 text-white gap-4">
                            <div className="flex items-center gap-2">
                                <Icons.Settings />
                                <h3 className="font-bold text-lg font-display uppercase tracking-wide">Central de Classificação</h3>
                            </div>
                            <div className="flex bg-gray-800 rounded-lg p-1 gap-1">
                                <button onClick={() => setActiveTab('unidades')} className={`px-4 py-1.5 rounded-md text-sm font-bold transition-colors ${activeTab === 'unidades' ? 'bg-pratique-red text-white' : 'text-gray-400 hover:text-white'}`}>1. Por Unidade</button>
                                <button onClick={() => setActiveTab('grupos')} className={`px-4 py-1.5 rounded-md text-sm font-bold transition-colors ${activeTab === 'grupos' ? 'bg-pratique-red text-white' : 'text-gray-400 hover:text-white'}`}>2. Por Grupos (Entradas)</button>
                            </div>
                            <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full transition-colors"><Icons.Close /></button>
                        </div>
                        
                        <div className="p-4 border-b bg-white">
                            <input type="text" placeholder="Pesquisar por nomenclatura específica..." className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pratique-red outline-none text-sm" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                        </div>

                        {activeTab === 'unidades' ? (
                            <div className="flex-1 overflow-y-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6 bg-gray-50">
                                <div className="flex flex-col bg-white rounded-xl shadow-sm border-t-4 border-pratique-red overflow-hidden">
                                    <div className="p-3 bg-red-50 text-pratique-red font-bold text-center border-b border-red-100 uppercase text-sm">Santa Inês 1 ({si1Plans.length})</div>
                                    <div className="flex-1 overflow-y-auto p-3 space-y-3">{si1Plans.map(p => <PlanUnitCard key={p} plan={p} currentUnit="SI1" />)}</div>
                                </div>
                                <div className="flex flex-col bg-white rounded-xl shadow-sm border-t-4 border-gray-800 overflow-hidden">
                                    <div className="p-3 bg-gray-100 text-gray-800 font-bold text-center border-b border-gray-200 uppercase text-sm">Santa Inês 2 ({si2Plans.length})</div>
                                    <div className="flex-1 overflow-y-auto p-3 space-y-3">{si2Plans.map(p => <PlanUnitCard key={p} plan={p} currentUnit="SI2" />)}</div>
                                </div>
                                <div className="flex flex-col bg-white rounded-xl shadow-sm border-t-4 border-slate-400 overflow-hidden">
                                    <div className="p-3 bg-slate-100 text-slate-700 text-center border-b border-slate-200 flex flex-col"><span className="font-bold uppercase text-sm">Não Classificados ({ignoredPlans.length})</span><span className="text-[10px] text-slate-500 mt-1 leading-tight">Planos não entram em métricas.</span></div>
                                    <div className="flex-1 overflow-y-auto p-3 space-y-3">{ignoredPlans.map(p => <PlanUnitCard key={p} plan={p} currentUnit="IGNORE" />)}</div>
                                </div>
                            </div>
                        ) : (
                            <div className="flex-1 overflow-y-auto p-6 bg-gray-50 flex flex-col gap-8">
                                <div className="flex flex-col">

                    <div className="bg-gray-900 rounded-2xl p-8 text-white shadow-2xl border-t-4 border-pratique-red relative overflow-hidden">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b border-gray-700 pb-6">
                            <div className="flex items-center gap-2">
                                <Icons.Chart />
                                <h3 className="text-2xl font-display font-bold uppercase tracking-wider">Consolidado Geral</h3>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-2 lg:grid-cols-4 xl:grid-cols-8 gap-4">
                            <ValCard title="Faturamento" hasData={flags.hasSales} value={formatCurrency(totalFaturamento)} valueClass="text-white" />
                            <ValCard title="Caixa" hasData={flags.hasReceipts} value={formatCurrency(totalRecebido)} valueClass="text-green-400" />
                            <ValCard title="Recebíveis" hasData={flags.hasReceivables} value={formatCurrency(totalRecebiveis)} valueClass="text-purple-400" />
                            <ValCard title="Entradas" hasData={flags.hasEntradas} value={formatNumber(totalEntradas)} valueClass="text-orange-400" />
                            <ValCard title="Ativos" hasData={flags.hasActives} value={formatNumber(totalAtivos)} valueClass="text-blue-400" />
                            <ValCard title="Cancelados" hasData={flags.hasCancelados} value={formatNumber(totalCancelados)} valueClass="text-pink-400" />
                            <ValCard title="Vis. Globais" hasData={flags.hasVisitantes} value={formatNumber(vTotais)} valueClass="text-sky-400" />
                            <ValCard title="Vis. Wellhub" hasData={flags.hasVisitantes} value={formatNumber(vWellhub)} valueClass="text-sky-400" />
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = () => {
            const [etapa, setEtapa] = useState('IMPORTACAO'); // 'IMPORTACAO' | 'CONFERENCIA'

            const [rawSales, setRawSales] = useState(null);
            const [rawReceipts, setRawReceipts] = useState(null);
            const [rawReceivables, setRawReceivables] = useState(null);
            const [rawActives, setRawActives] = useState(null);
            const [rawEntradas, setRawEntradas] = useState(null);
            const [rawCancelados, setRawCancelados] = useState(null);
            const [rawVisitantes, setRawVisitantes] = useState(null);
            
            const [salesData, setSalesData] = useState(null);
            const [receiptsData, setReceiptsData] = useState(null);
            const [receivablesData, setReceivablesData] = useState(null);
            const [activesData, setActivesData] = useState(null);
            const [entradasData, setEntradasData] = useState(null);
            const [canceladosData, setCanceladosData] = useState(null);
            const [visitantesData, setVisitantesData] = useState(null);
            
            const [planOverrides, setPlanOverrides] = useState(() => {
                try { const saved = localStorage.getItem('plan_overrides'); return saved ? JSON.parse(saved) : {}; } catch (e) { return {}; }
            });

            const [entradasGroupOverrides, setEntradasGroupOverrides] = useState(() => {
                try { const saved = localStorage.getItem('entradas_group_overrides'); return saved ? JSON.parse(saved) : {}; } catch (e) { return {}; }
            });

            const [allPlans, setAllPlans] = useState(new Set());
            const [entradasPlans, setEntradasPlans] = useState(new Set());
            const [configOpen, setConfigOpen] = useState(false);
            
            const [modalOpen, setModalOpen] = useState(false);
            const [modalTitle, setModalTitle] = useState('');
            const [modalItems, setModalItems] = useState([]);
            const [modalColor, setModalColor] = useState('bg-gray-800');

            const [entModalOpen, setEntModalOpen] = useState(false);
            const [entModalTitle, setEntModalTitle] = useState('');
            const [entModalItemsMap, setEntModalItemsMap] = useState({});
            const [entModalColor, setEntModalColor] = useState('bg-gray-800');

            const [sendingEmail, setSendingEmail] = useState(false);

            useEffect(() => { localStorage.setItem('plan_overrides', JSON.stringify(planOverrides)); }, [planOverrides]);
            useEffect(() => { localStorage.setItem('entradas_group_overrides', JSON.stringify(entradasGroupOverrides)); }, [entradasGroupOverrides]);

            const openModal = (title, items, color) => { setModalTitle(title); setModalItems(items || []); setModalColor(color); setModalOpen(true); };
            const openEntradasModal = (title, itemsMap, color) => { setEntModalTitle(title); setEntModalItemsMap(itemsMap || {}); setEntModalColor(color); setEntModalOpen(true); };

            const flags = {
                hasSales: !!rawSales,
                hasReceipts: !!rawReceipts,
                hasReceivables: !!rawReceivables,
                hasActives: !!rawActives,
                hasEntradas: !!rawEntradas,
                hasCancelados: !!rawCancelados,
                hasVisitantes: !!rawVisitantes
            };

            const loadedCount = Object.values(flags).filter(Boolean).length;
            const isReadyToView = loadedCount >= 3;

            const getValidationErrors = () => {
                const errs = [];
                if (flags.hasEntradas && entradasData) {
                    const si1Groups = entradasData.si1.grupos;
                    if (si1Groups) {
                        const sumSI1 = si1Groups.NUTRI.count + si1Groups.PLUS.count + si1Groups.FIT.count + si1Groups.CLASS.count + si1Groups.OUTROS.count;
                        if (sumSI1 !== entradasData.si1.count) errs.push('A composição das Entradas da Santa Inês 1 não fecha.');
                    }
                    const si2Groups = entradasData.si2.grupos;
                    if (si2Groups) {
                        const sumSI2 = si2Groups.NUTRI.count + si2Groups.PLUS.count + si2Groups.FIT.count + si2Groups.CLASS.count + si2Groups.OUTROS.count;
                        if (sumSI2 !== entradasData.si2.count) errs.push('A composição das Entradas da Santa Inês 2 não fecha.');
                    }
                }
                return errs;
            };

            const montarPayloadFechamento = () => {
                const now = new Date();
                const dataStr = now.toLocaleDateString('pt-BR');
                const horaStr = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                return {
                    enviadoEm: now.toISOString(),
                    dataStr,
                    horaStr,
                    arquivos: flags,
                    si1: {
                        faturamento: flags.hasSales ? (salesData?.si1.total || 0) : null,
                        recebimento: flags.hasReceipts ? (receiptsData?.si1.total || 0) : null,
                        recebiveis: flags.hasReceivables ? (receivablesData?.si1.total || 0) : null,
                        ativos: flags.hasActives ? (activesData?.si1.count || 0) : null,
                        entradas: flags.hasEntradas ? (entradasData?.si1.count || 0) : null,
                        cancelados: flags.hasCancelados ? (canceladosData?.si1.count || 0) : null,
                        gruposEntradas: flags.hasEntradas && entradasData?.si1.grupos ? {
                            nutri: entradasData.si1.grupos.NUTRI.count,
                            plus: entradasData.si1.grupos.PLUS.count,
                            fit: entradasData.si1.grupos.FIT.count,
                            class: entradasData.si1.grupos.CLASS.count,
                            outros: entradasData.si1.grupos.OUTROS.count,
                        } : null
                    },
                    si2: {
                        faturamento: flags.hasSales ? (salesData?.si2.total || 0) : null,
                        recebimento: flags.hasReceipts ? (receiptsData?.si2.total || 0) : null,
                        recebiveis: flags.hasReceivables ? (receivablesData?.si2.total || 0) : null,
                        ativos: flags.hasActives ? (activesData?.si2.count || 0) : null,
                        entradas: flags.hasEntradas ? (entradasData?.si2.count || 0) : null,
                        cancelados: flags.hasCancelados ? (canceladosData?.si2.count || 0) : null,
                        personalClass: flags.hasReceipts ? (receiptsData?.si2.personalClassCount || 0) : null,
                        gruposEntradas: flags.hasEntradas && entradasData?.si2.grupos ? {
                            nutri: entradasData.si2.grupos.NUTRI.count,
                            plus: entradasData.si2.grupos.PLUS.count,
                            fit: entradasData.si2.grupos.FIT.count,
                            class: entradasData.si2.grupos.CLASS.count,
                            outros: entradasData.si2.grupos.OUTROS.count,
                        } : null
                    },
                    globais: flags.hasVisitantes ? {
                        visitantes: visitantesData?.visitantes || 0,
                        visitantesWellhub: visitantesData?.wellhub || 0
                    } : null,
                    consolidado: {
                        faturamento: flags.hasSales ? ((salesData?.si1.total || 0) + (salesData?.si2.total || 0)) : null,
                        recebimento: flags.hasReceipts ? ((receiptsData?.si1.total || 0) + (receiptsData?.si2.total || 0)) : null,
                        recebiveis: flags.hasReceivables ? ((receivablesData?.si1.total || 0) + (receivablesData?.si2.total || 0)) : null,
                        ativos: flags.hasActives ? ((activesData?.si1.count || 0) + (activesData?.si2.count || 0)) : null,
                        entradas: flags.hasEntradas ? ((entradasData?.si1.count || 0) + (entradasData?.si2.count || 0)) : null,
                        cancelados: flags.hasCancelados ? ((canceladosData?.si1.count || 0) + (canceladosData?.si2.count || 0)) : null
                    },
                    configuracao: {
                        si1: Array.from(allPlans).filter(p => getUnit(p, planOverrides) === 'SI1').length,
                        si2: Array.from(allPlans).filter(p => getUnit(p, planOverrides) === 'SI2').length,
                        ignorados: Array.from(allPlans).filter(p => getUnit(p, planOverrides) === 'IGNORE').length
                    }
                };
            };

            const handleVisualizarDados = async () => {
                if (!isReadyToView || sendingEmail) return;

                const errors = getValidationErrors();
                if (errors.length > 0) {
                    alert("Atenção:\n" + errors.join('\n') + "\nPor favor, revise a aba Configuração antes de visualizar os dados.");
                    return;
                }

                setEtapa('CONFERENCIA');
                setSendingEmail(true);
                
                const payload = montarPayloadFechamento();

                try {
                    const res = await fetch('/api/enviar-fechamento', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const contentType = res.headers.get('content-type') || '';
                    
                    if (!res.ok) {
                        const errorBody = contentType.includes('application/json') ? await res.json() : await res.text();
                        throw new Error(typeof errorBody === 'string' ? errorBody : (errorBody?.error || 'Falha no envio'));
                    }

                    const data = contentType.includes('application/json') ? await res.json() : null;
                    
                    if (data && data.success) {
                        console.log('[RELATORIO] Resumo enviado com sucesso ao gestor. ID:', data.messageId);
                    } else {
                        throw new Error('Servidor não retornou confirmação de sucesso.');
                    }
                } catch (error) {
                    // Erro engolido silenciosamente da interface do usuário. Apenas aparece no log do console técnico.
                    console.error("[RELATORIO_TECNICO] Falha ao enviar fechamento:", error);
                } finally {
                    setSendingEmail(false);
                }
            };

            useEffect(() => {
                if (rawSales) calculateSales(rawSales); if (rawReceipts) calculateReceipts(rawReceipts);
                if (rawReceivables) calculateReceivables(rawReceivables); if (rawActives) calculateActives(rawActives);
                if (rawEntradas) calculateEntradas(rawEntradas); if (rawCancelados) calculateCancelados(rawCancelados);
                if (rawVisitantes) calculateVisitantes(rawVisitantes);
            }, [planOverrides, entradasGroupOverrides, rawSales, rawReceipts, rawReceivables, rawActives, rawEntradas, rawCancelados, rawVisitantes]);

            const updatePlanList = (newPlans) => { setAllPlans(prev => { const next = new Set(prev); newPlans.forEach(p => next.add(p)); return next; }); };
            const updateEntradasPlanList = (newPlans) => { setEntradasPlans(prev => { const next = new Set(prev); newPlans.forEach(p => next.add(p)); return next; }); };

            const toggleUnitOverride = (plan, targetUnit) => setPlanOverrides(prev => ({ ...prev, [plan]: targetUnit }));
            const toggleGroupOverride = (plan, targetGroup) => setEntradasGroupOverrides(prev => ({ ...prev, [plan]: targetGroup }));

            const calculateSales = (data) => {
                let stats = { si1: { total: 0, count: 0, nutriCount: 0, plusCount: 0, nutriList: [], plusList: [] }, si2: { total: 0, count: 0, nutriCount: 0, plusCount: 0, nutriList: [], plusList: [] } };
                data.rows.forEach(row => {
                    const val = parseMoney(row[data.valIdx]); const plan = row[data.planIdx]; if(!plan) return;
                    const unit = getUnit(plan, planOverrides); if (unit === 'IGNORE') return;
                    const isNutri = isNutriPlan(plan); const isPlus = isPlusPlan(plan, isNutri); const itemDetail = { name: plan, value: val };
                    if (unit === 'SI2') {
                        stats.si2.total += val; stats.si2.count++;
                        if (isNutri) { stats.si2.nutriCount++; stats.si2.nutriList.push(itemDetail); } else if (isPlus) { stats.si2.plusCount++; stats.si2.plusList.push(itemDetail); }
                    } else {
                        stats.si1.total += val; stats.si1.count++;
                        if (isNutri) { stats.si1.nutriCount++; stats.si1.nutriList.push(itemDetail); } else if (isPlus) { stats.si1.plusCount++; stats.si1.plusList.push(itemDetail); }
                    }
                });
                setSalesData(stats);
            };

            const calculateReceipts = (data) => {
                let stats = { si1: { total: 0 }, si2: { total: 0, personalClassCount: 0 } };
                data.rows.forEach(row => {
                    const val = parseMoney(row[data.valIdx]); const plan = row[data.planIdx]; if(!plan) return;
                    const unit = getUnit(plan, planOverrides); if (unit === 'IGNORE') return;
                    if (unit === 'SI2') {
                        stats.si2.total += val;
                        const nomePlano = String(plan || '').trim().replace(/\s+/g, ' ').toUpperCase();
                        if (nomePlano.startsWith('SANTA INES 2 | CLASS')) stats.si2.personalClassCount++;
                    } else { stats.si1.total += val; }
                });
                setReceiptsData(stats);
            };

            const calculateReceivables = (data) => {
                let stats = { si1: { total: 0 }, si2: { total: 0 } };
                data.rows.forEach(row => {
                    const val = parseMoney(row[data.valIdx]); const plan = row[data.planIdx]; if(!plan) return;
                    const unit = getUnit(plan, planOverrides); if (unit === 'IGNORE') return;
                    if (unit === 'SI2') { stats.si2.total += val; } else { stats.si1.total += val; }
                });
                setReceivablesData(stats);
            };

            const calculateActives = (data) => {
                let stats = { si1: { count: 0 }, si2: { count: 0 } };
                data.rows.forEach(row => { const plan = row[data.planIdx]; if(!plan) return; const unit = getUnit(plan, planOverrides); if (unit === 'IGNORE') return; if (unit === 'SI2') stats.si2.count++; else stats.si1.count++; });
                setActivesData(stats);
            };

            const calculateEntradas = (data) => {
                const initGrupos = () => ({ NUTRI: { count: 0, itens: {} }, PLUS: { count: 0, itens: {} }, FIT: { count: 0, itens: {} }, CLASS: { count: 0, itens: {} }, OUTROS: { count: 0, itens: {} } });
                let stats = { si1: { count: 0, grupos: initGrupos() }, si2: { count: 0, grupos: initGrupos() } };
                
                data.rows.forEach(row => {
                    const plan = row[data.planIdx]; if(!plan) return;
                    const unit = getUnit(plan, planOverrides); if (unit === 'IGNORE') return;

                    const target = unit === 'SI2' ? stats.si2 : stats.si1;
                    target.count++;
                    const grupo = classificarGrupoEntrada(plan, entradasGroupOverrides);
                    target.grupos[grupo].count++;
                    target.grupos[grupo].itens[plan] = (target.grupos[grupo].itens[plan] || 0) + 1;
                });
                setEntradasData(stats);
            };

            const calculateCancelados = (data) => {
                let stats = { si1: { count: 0 }, si2: { count: 0 } };
                data.rows.forEach(row => { const plan = row[data.planIdx]; if(!plan) return; const unit = getUnit(plan, planOverrides); if (unit === 'IGNORE') return; if (unit === 'SI2') stats.si2.count++; else stats.si1.count++; });
                setCanceladosData(stats);
            };

            const calculateVisitantes = (data) => {
                let stats = { visitantes: 0, wellhub: 0 };
                data.rows.forEach(row => { const valStr = String(row[data.colIdx] || '').trim().toUpperCase(); if (!valStr) return; if (valStr.includes('WELLHUB') || valStr.includes('GYMPASS')) { stats.wellhub++; } else if (valStr.includes('VISITANT')) { stats.visitantes++; } });
                setVisitantesData(stats);
            };

            const handleSalesUpload = (file) => {
                const reader = new FileReader(); reader.onload = (e) => {
                    const wb = XLSX.read(e.target.result, { type: 'binary' }); const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                    const hIdx = findHeader(json, ['PLANO', 'VALOR', 'PRODUTO', 'MATRÍCULA']); const { planIdx, valIdx } = findSmartColumns(json[hIdx], json[hIdx+1]);
                    const rows = json.slice(hIdx + 1).filter(r => r && r[planIdx]); updatePlanList(rows.map(r => r[planIdx]).filter(Boolean)); setRawSales({ rows, planIdx, valIdx });
                }; reader.readAsBinaryString(file);
            };

            const handleReceiptsUpload = (file) => {
                const reader = new FileReader(); reader.onload = (e) => {
                    const wb = XLSX.read(e.target.result, { type: 'binary' }); const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                    const hIdx = findHeader(json, ['PLANO', 'PAGO', 'RECEBIDO']); const { planIdx, valIdx } = findSmartColumns(json[hIdx], json[hIdx+1]);
                    const rows = json.slice(hIdx + 1).filter(r => r && r[planIdx]); updatePlanList(rows.map(r => r[planIdx]).filter(Boolean)); setRawReceipts({ rows, planIdx, valIdx });
                }; reader.readAsBinaryString(file);
            };

            const handleReceivablesUpload = (file) => {
                const reader = new FileReader(); reader.onload = (e) => {
                    const wb = XLSX.read(e.target.result, { type: 'binary' }); const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                    const hIdx = findHeader(json, ['PLANO', 'VALOR', 'RECEBER', 'COMPENSADO']); let planIdx = 20; let valIdx = 7;   
                    if (json[hIdx]) { const smart = findSmartColumns(json[hIdx], json[hIdx+1]); if(smart.planIdx !== 12) planIdx = smart.planIdx; if(smart.valIdx !== 19) valIdx = smart.valIdx; }
                    const rows = json.slice(hIdx + 1).filter(r => r && r[planIdx]); updatePlanList(rows.map(r => r[planIdx]).filter(Boolean)); setRawReceivables({ rows, planIdx, valIdx });
                }; reader.readAsBinaryString(file);
            };

            const handleActivesUpload = (file) => {
                const reader = new FileReader(); reader.onload = (e) => {
                    const wb = XLSX.read(e.target.result, { type: 'binary' }); const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                    const hIdx = findHeader(json, ['MATRÍCULA', 'PLANO']); let planIdx = 22; if (json[hIdx]) { const headers = json[hIdx].map(h => String(h).toUpperCase()); const found = headers.findIndex(h => h === 'PLANO'); if (found !== -1) planIdx = found; }
                    const rows = json.slice(hIdx + 1).filter(r => r && (r[0] || r[planIdx])); updatePlanList(rows.map(r => r[planIdx]).filter(Boolean)); setRawActives({ rows, planIdx });
                }; reader.readAsBinaryString(file);
            };

            const handleEntradasUpload = (file) => {
                const reader = new FileReader(); reader.onload = (e) => {
                    const wb = XLSX.read(e.target.result, { type: 'binary' }); const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                    const hIdx = findHeader(json, ['MATRÍCULA', 'PLANO', 'ENTRADA', 'NOME']); const planIdx = 23; 
                    const rows = json.slice(hIdx + 1).filter(r => { if (!r) return false; const plan = r[planIdx]; if (!plan || String(plan).trim() === '' || String(plan).toUpperCase() === 'PLANO') return false; return true; });
                    const extractedPlans = rows.map(r => r[planIdx]).filter(Boolean);
                    updatePlanList(extractedPlans); updateEntradasPlanList(extractedPlans); 
                    setRawEntradas({ rows, planIdx });
                }; reader.readAsBinaryString(file);
            };

            const handleCanceladosUpload = (file) => {
                const reader = new FileReader(); reader.onload = (e) => {
                    const wb = XLSX.read(e.target.result, { type: 'binary' }); const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                    const hIdx = findHeader(json, ['MATRÍCULA', 'PLANO', 'CANCELADO', 'NOME']); const planIdx = 23; 
                    const rows = json.slice(hIdx + 1).filter(r => { if (!r) return false; const plan = r[planIdx]; if (!plan || String(plan).trim() === '' || String(plan).toUpperCase() === 'PLANO') return false; return true; });
                    updatePlanList(rows.map(r => r[planIdx]).filter(Boolean)); setRawCancelados({ rows, planIdx });
                }; reader.readAsBinaryString(file);
            };

            const handleVisitantesUpload = (file) => {
                const reader = new FileReader(); reader.onload = (e) => {
                    const wb = XLSX.read(e.target.result, { type: 'binary' }); const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                    const colIdx = 9; const rows = json.slice(1).filter(r => r && r[colIdx]); setRawVisitantes({ rows, colIdx });
                }; reader.readAsBinaryString(file);
            };

            const reset = () => {
                if(confirm("Deseja realmente limpar a visualização? Todos os arquivos e dados atuais serão removidos.")) {
                    setEtapa('IMPORTACAO');
                    setRawSales(null); setRawReceipts(null); setRawReceivables(null); setRawActives(null); setRawEntradas(null); setRawCancelados(null); setRawVisitantes(null);
                    setSalesData(null); setReceiptsData(null); setReceivablesData(null); setActivesData(null); setEntradasData(null); setCanceladosData(null); setVisitantesData(null);
                    setAllPlans(new Set()); setEntradasPlans(new Set());
                }
            };

            const ignoredCount = Array.from(allPlans).filter(p => getUnit(p, planOverrides) === 'IGNORE').length;

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-[1400px] mx-auto flex flex-col">
                    <header className="mb-8 flex flex-col md:flex-row justify-between items-center gap-4 animate-up">
                        <div className="flex items-center gap-3">
                            <div className="bg-pratique-red text-white p-3 rounded-lg font-display font-bold text-2xl">P</div>
                            <div>
                                <h1 className="text-3xl font-display font-bold text-gray-800 uppercase tracking-tight">Painel Gestão <span className="text-pratique-red">Santa Inês</span></h1>
                                <p className="text-gray-500 text-sm">Painel de Consulta Executiva</p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setConfigOpen(true)} className="flex items-center gap-2 text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg transition-colors font-medium">
                                <Icons.Settings /> Configuração
                            </button>
                            <button onClick={reset} className="flex items-center gap-2 text-sm text-gray-500 hover:text-pratique-red transition-colors px-2">
                                <Icons.Refresh /> Limpar Tudo
                            </button>
                        </div>
                    </header>

                    {/* --- ETAPA 1: IMPORTAÇÃO --- */}
                    {etapa === 'IMPORTACAO' && (
                        <div className="animate-fade-in flex flex-col gap-8">
                            <div className="text-center max-w-2xl mx-auto mb-4">
                                <h2 className="text-2xl font-display font-bold text-gray-800 uppercase tracking-wide">Importar Dados</h2>
                                <p className="text-gray-500 mt-2">Carregue no mínimo 3 fontes quaisquer para visualizar o painel.</p>
                            </div>

                            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8">
                                <div className="flex justify-between items-end mb-6">
                                    <h3 className="font-bold text-gray-700 uppercase tracking-wider flex items-center gap-2"><Icons.Upload /> Fontes de Dados</h3>
                                </div>

                                <section className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
                                    <FileCard title="1. Faturamento" onUpload={handleSalesUpload} status={flags.hasSales} />
                                    <FileCard title="2. Recebimento" onUpload={handleReceiptsUpload} status={flags.hasReceipts} />
                                    <FileCard title="3. Recebíveis" onUpload={handleReceivablesUpload} status={flags.hasReceivables} />
                                    <FileCard title="4. Ativos" onUpload={handleActivesUpload} status={flags.hasActives} />
                                    <FileCard title="5. Entradas" onUpload={handleEntradasUpload} status={flags.hasEntradas} />
                                    <FileCard title="6. Cancelados" onUpload={handleCanceladosUpload} status={flags.hasCancelados} />
                                    <FileCard title="7. Visitantes" onUpload={handleVisitantesUpload} status={flags.hasVisitantes} />
                                </section>
                            </div>

                            <div className="flex flex-col items-center mt-2 gap-3">
                                <p className={`text-sm font-bold ${isReadyToView ? 'text-green-600' : 'text-gray-400'}`}>
                                    {isReadyToView ? `${loadedCount} fontes carregadas. Pronto para visualizar.` : `${loadedCount} de 3 fontes mínimas carregadas`}
                                </p>
                                
                                <button 
                                    onClick={handleVisualizarDados}
                                    disabled={!isReadyToView || sendingEmail}
                                    className={`px-10 py-4 rounded-xl font-bold text-lg uppercase tracking-wide transition-all shadow-lg flex items-center gap-3
                                        ${isReadyToView ? 'bg-pratique-red text-white hover:bg-red-700 hover:shadow-xl hover:-translate-y-1' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
                                >
                                    {sendingEmail ? <><span className="loader"></span> PROCESSANDO...</> : <>VISUALIZAR DADOS <span className="text-2xl leading-none">→</span></>}
                                </button>

                                <p className="text-xs text-gray-400 mt-1">Ao visualizar, um resumo deste fechamento é encaminhado ao gestor.</p>
                            </div>
                        </div>
                    )}

                    {/* --- ETAPA 2: CONFERÊNCIA --- */}
                    {etapa === 'CONFERENCIA' && (
                        <div className="animate-fade-in flex flex-col gap-8">
                            
                            {/* StatusBar de Navegação (MENSAGEM DE ERRO REMOVIDA) */}
                            <div className="flex flex-col md:flex-row justify-between items-center bg-gray-900 text-white p-4 rounded-xl shadow-lg border-l-4 border-pratique-red gap-4">
                                <div>
                                    <h2 className="text-xl font-display font-bold uppercase tracking-wide">Visualização de Dados</h2>
                                    <div className="mt-1 flex items-center gap-2 text-sm">
                                        <span className="text-gray-400">Ao visualizar, um resumo deste fechamento é encaminhado ao gestor.</span>
                                    </div>
                                </div>
                                <button onClick={() => setEtapa('IMPORTACAO')} className="flex items-center gap-2 text-sm bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-colors font-medium border border-gray-700 w-full md:w-auto justify-center">
                                    <Icons.ArrowLeft /> Voltar para Importação
                                </button>
                            </div>

                            {ignoredCount > 0 && (
                                <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-xl flex items-start gap-3 shadow-sm">
                                    <div className="text-yellow-600 mt-0.5"><Icons.Alert /></div>
                                    <div>
                                        <p className="text-sm font-bold text-yellow-800">Aviso Operacional</p>
                                        <p className="text-xs text-yellow-700 mt-1">Existem <strong>{ignoredCount} nomenclaturas</strong> marcadas como "Não Classificados" na Configuração. Elas não estão compondo os resultados abaixo.</p>
                                    </div>
                                    <button onClick={() => setConfigOpen(true)} className="ml-auto text-xs font-bold uppercase text-yellow-700 hover:text-yellow-900 underline">Revisar Configuração</button>
                                </div>
                            )}

                            <main className="flex flex-col md:flex-row gap-8 flex-grow">
                                <UnitColumn unit="SANTA INÊS 1" sales={salesData?.si1} receipts={receiptsData?.si1} receivables={receivablesData?.si1} actives={activesData?.si1} entradas={entradasData?.si1} cancelados={canceladosData?.si1} isSI2={false} onOpenModal={openModal} onOpenEntradasModal={openEntradasModal} flags={flags} />
                                <div className="hidden md:block w-px bg-gray-300 self-stretch"></div>
                                <UnitColumn unit="SANTA INÊS 2" sales={salesData?.si2} receipts={receiptsData?.si2} receivables={receivablesData?.si2} actives={activesData?.si2} entradas={entradasData?.si2} cancelados={canceladosData?.si2} isSI2={true} onOpenModal={openModal} onOpenEntradasModal={openEntradasModal} flags={flags} />
                            </main>

                            <div className="mt-4">
                                <div className="flex items-center gap-2 mb-4">
                                    <h3 className="text-xl font-display font-bold text-gray-700 uppercase tracking-wider">Indicadores Gerais da Operação</h3>
                                    <div className="h-px bg-gray-300 flex-1 ml-2"></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl">
                                    <div className="bg-white p-6 rounded-xl card-shadow border-l-4 border-sky-500">
                                        <div className="flex justify-between items-start mb-2"><span className="text-gray-500 font-bold text-sm uppercase tracking-wider">Visitantes</span><div className="p-2 rounded-lg bg-sky-50 text-sky-600"><Icons.Users /></div></div>
                                        {flags.hasVisitantes ? (
                                            <div className="text-4xl font-display font-bold text-gray-800">{formatNumber(visitantesData?.visitantes)}</div>
                                        ) : (
                                            <div className="text-lg text-gray-400 font-medium mt-1">Não carregado</div>
                                        )}
                                    </div>
                                    <div className="bg-white p-6 rounded-xl card-shadow border-l-4 border-sky-500">
                                        <div className="flex justify-between items-start mb-2"><span className="text-gray-500 font-bold text-sm uppercase tracking-wider">Visitantes - Wellhub</span><div className="p-2 rounded-lg bg-sky-50 text-sky-600"><Icons.Users /></div></div>
                                        {flags.hasVisitantes ? (
                                            <div className="text-4xl font-display font-bold text-gray-800">{formatNumber(visitantesData?.wellhub)}</div>
                                        ) : (
                                            <div className="text-lg text-gray-400 font-medium mt-1">Não carregado</div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <FooterSummary 
                                sales={salesData} receipts={receiptsData} receivables={receivablesData} 
                                actives={activesData} entradas={entradasData} cancelados={canceladosData} 
                                visitantes={visitantesData} flags={flags}
                            />
                        </div>
                    )}

                    <DetailModal isOpen={modalOpen} onClose={() => setModalOpen(false)} title={modalTitle} items={modalItems} colorClass={modalColor} />
                    <EntradasDetailModal isOpen={entModalOpen} onClose={() => setEntModalOpen(false)} title={entModalTitle} itemsMap={entModalItemsMap} colorClass={entModalColor} />
                    <ConfigModal isOpen={configOpen} onClose={() => setConfigOpen(false)} allPlans={Array.from(allPlans)} entradasPlans={Array.from(entradasPlans)} unitOverrides={planOverrides} groupOverrides={entradasGroupOverrides} onToggleUnitOverride={toggleUnitOverride} onToggleGroupOverride={toggleGroupOverride} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
